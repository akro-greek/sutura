services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sutura_scrolls_development
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sutura_scrolls_development"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  web:
    build: .
    command: ["bin/rails", "server", "-b", "0.0.0.0"]
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sutura_scrolls_development
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    volumes: [".:/rails", "bundle:/usr/local/bundle"]

  worker:
    build: .
    command: ["bin/rails", "solid_queue:start"]
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sutura_scrolls_development
    depends_on:
      db: { condition: service_healthy }
    volumes: [".:/rails", "bundle:/usr/local/bundle"]

volumes:
  postgres_data:
  bundle:
